name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bgx-*
          path: dist
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat dist/SHA256SUMS-linux dist/SHA256SUMS-darwin > dist/SHA256SUMS
          gh release create "$RELEASE_TAG" dist/bgx-*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "bgx ${RELEASE_TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md
